name: Deploy DEV (Supabase)

# Ao entrar em `develop` (via PR homologado), aplica schema + functions no
# projeto Supabase de DESENVOLVIMENTO. O frontend de DEV roda local
# (npm run dev) — GitHub Pages serve só 1 site por repo (o de produção).
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Mesma trava do deploy.yml: `workflow_dispatch` aceita qualquer branch, então
# sem isto daria para empurrar migration de uma feature direto no Supabase DEV
# sem passar por PR em develop.
jobs:
  supabase-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: Development
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      # v2 é composite action — não roda em Node do runner, então sai do aviso
      # de deprecação do Node 20 sem mudar nenhum input. A versão do CLI segue
      # fixa de propósito: `latest` faria o schema depender de quando rodou.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Link
        run: supabase link --project-ref "$REF"
      - name: Migrations (db push)
        run: supabase db push
      - name: Edge Functions
        run: |
          supabase functions deploy wellhub-webhook --no-verify-jwt --project-ref "$REF"
          supabase functions deploy enviar-emails --project-ref "$REF"
          # Sem --no-verify-jwt de propósito: quem chama é o cron do banco
          # (disparar_publicacao_grade_wellhub), com Bearer da anon_key do
          # Vault. A função não checa auth sozinha — Deno.serve ignora o
          # request e usa a service_role —, então liberar o JWT deixaria
          # qualquer um disparando publicação de grade na Wellhub.
          supabase functions deploy wellhub-publicar-grade --project-ref "$REF"

      # Um passo por função a partir daqui. Num bloco único, o `bash -e`
      # para no primeiro erro e o nome do passo não diz qual função
      # falhou — a única pista é o log, que exige admin no repositório
      # para ser lido. Com passos nomeados, o próprio painel responde.
      - name: Edge Function — asaas-webhook
        # --no-verify-jwt: quem chama é o Asaas, que manda o token DELE no
        # header `asaas-access-token`, não um JWT do Supabase. Com
        # verificação todo webhook levaria 401 — e 15 falhas seguidas
        # PAUSAM a fila inteira da conta no Asaas.
        run: supabase functions deploy asaas-webhook --no-verify-jwt --project-ref "$REF"

      - name: Edge Function — asaas-cobranca
        # MANTÉM a verificação: é chamada pela tela (JWT da gestão) e pelo
        # cron `emitir-cobrancas` (Bearer da anon_key do Vault). Liberar
        # deixaria qualquer um emitindo cobrança no gateway.
        run: supabase functions deploy asaas-cobranca --project-ref "$REF"
