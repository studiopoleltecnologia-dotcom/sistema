name: Deploy PRODUÇÃO (Supabase + GitHub Pages)

# Entrou em `main` (promoção via PR develop→main): aplica schema + functions
# na PRODUÇÃO e publica o frontend no GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Schema + Edge Functions na produção ANTES do frontend (o site novo já
  #    encontra o banco no formato esperado).
  supabase-prod:
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase link --project-ref "$REF"
      - run: supabase db push
      - run: |
          supabase functions deploy wellhub-webhook --no-verify-jwt --project-ref "$REF"
          supabase functions deploy enviar-emails --project-ref "$REF"

  build:
    needs: supabase-prod
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Domínio próprio (CNAME) serve a raiz — sem servidor para rewrite de
      # SPA, então /agendamentos e /portalequipe (portais aluna/professora,
      # App.tsx jornadaAtual()) precisam de um index.html físico próprio.
      # É cópia do mesmo bundle: a jornada é decidida em runtime pelo path.
      - run: |
          mkdir -p dist/agendamentos dist/portalequipe
          cp dist/index.html dist/agendamentos/index.html
          cp dist/index.html dist/portalequipe/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
