name: Deploy PRODUÇÃO (Supabase + GitHub Pages)

# Entrou em `main` (promoção via PR develop→main): aplica schema + functions
# na PRODUÇÃO e publica o frontend no GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# `workflow_dispatch` deixa escolher QUALQUER branch no "Use workflow from".
# Sem esta trava, daria para rodar o deploy de PRODUÇÃO a partir de uma branch
# de feature — aplicando migration e publicando o site dela sem PR, sem CI e
# sem passar por develop. Branch protection não pega isso: ela protege o
# ponteiro da branch, não a execução de workflow que não toca esse ponteiro.
jobs:
  # 1) Schema + Edge Functions na produção ANTES do frontend (o site novo já
  #    encontra o banco no formato esperado).
  supabase-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      # v2 é composite action — não roda em Node do runner, então sai do aviso
      # de deprecação do Node 20 sem mudar nenhum input. A versão do CLI segue
      # fixa de propósito: `latest` faria o schema depender de quando rodou.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - run: supabase link --project-ref "$REF"
      - run: supabase db push
      # `--use-api` em TODAS: empacota no servidor, sem Docker. Sem a flag,
      # a CLI baixa `public.ecr.aws/supabase/edge-runtime` e o ECR público
      # limita download por IP — runners compartilham IP, e o deploy falha
      # com `toomanyrequests: Rate exceeded` sem nada ter mudado no código.
      # Ver o comentário mais longo em dev.yml. Não remover.
      - run: |
          supabase functions deploy --use-api wellhub-webhook --no-verify-jwt --project-ref "$REF"
          supabase functions deploy --use-api enviar-emails --project-ref "$REF"
          # Sem --no-verify-jwt de propósito: quem chama é o cron do banco
          # (disparar_publicacao_grade_wellhub), com Bearer da anon_key do
          # Vault. A função não checa auth sozinha — Deno.serve ignora o
          # request e usa a service_role —, então liberar o JWT deixaria
          # qualquer um disparando publicação de grade na Wellhub.
          supabase functions deploy --use-api wellhub-publicar-grade --project-ref "$REF"

      # Um passo por função a partir daqui — ver o comentário equivalente
      # em dev.yml: com passos nomeados, o painel diz qual função falhou
      # sem precisar do log (que exige admin no repositório).
      - name: Edge Function — asaas-webhook
        # --no-verify-jwt: quem chama é o Asaas, que manda o token DELE no
        # header `asaas-access-token`, não um JWT do Supabase. Com
        # verificação todo webhook levaria 401 — e 15 falhas seguidas
        # PAUSAM a fila inteira da conta no Asaas.
        run: supabase functions deploy --use-api asaas-webhook --no-verify-jwt --project-ref "$REF"

      - name: Edge Function — asaas-cobranca
        # MANTÉM a verificação: é chamada pela tela (JWT da gestão) e pelo
        # cron `emitir-cobrancas` (Bearer da anon_key do Vault). Liberar
        # deixaria qualquer um emitindo cobrança no gateway.
        run: supabase functions deploy --use-api asaas-cobranca --project-ref "$REF"

  build:
    needs: supabase-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Domínio próprio (CNAME) serve a raiz — sem servidor para rewrite de
      # SPA, então /agendamentos e /portalequipe (portais aluna/professora,
      # App.tsx jornadaAtual()) precisam de um index.html físico próprio.
      # É cópia do mesmo bundle: a jornada é decidida em runtime pelo path.
      - run: |
          mkdir -p dist/agendamentos dist/portalequipe
          cp dist/index.html dist/agendamentos/index.html
          cp dist/index.html dist/portalequipe/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # ---------------------------------------------------------------
      # Segundo endereço: aluno.studiopolel.com.br (portal do aluno).
      #
      # O GitHub Pages aceita UM domínio customizado por repositório (é o
      # que o arquivo `public/CNAME` guarda, hoje sistema.studiopolel.com.br).
      # Um segundo domínio exige, então, um segundo repositório — que não
      # tem código nenhum: é só hospedagem do MESMO bundle, do MESMO commit.
      #
      # Publicar daqui, e não por um pipeline próprio do outro repo, é o
      # ponto: assim o portal do aluno sobe DEPOIS do job `supabase-prod`,
      # com a mesma garantia de ordem que a produção já tem. Um deploy
      # independente poderia servir um front que espera um schema que
      # ainda não foi aplicado.
      #
      # No domínio do aluno o ERP não existe: `jornadaAtual()` (src/App.tsx)
      # decide pelo hostname, e o 404.html devolve o portal para qualquer
      # caminho digitado errado.
      #
      # Sem o token configurado o passo é PULADO, não falha: enquanto o DNS
      # não estiver de pé o domínio novo é opcional, e o deploy da produção
      # não pode ficar refém dele.
      - name: Publicar o portal do aluno no domínio próprio
        env:
          TOKEN: ${{ secrets.PAGES_PORTAL_ALUNO_TOKEN }}
          REPO_ALUNO: studiopoleltecnologia-dotcom/portal-aluno
          DOMINIO_ALUNO: aluno.studiopolel.com.br
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::PAGES_PORTAL_ALUNO_TOKEN ausente — $DOMINIO_ALUNO não foi publicado (o site da gestão subiu normalmente)."
            exit 0
          fi
          rm -rf portal-aluno
          cp -r dist portal-aluno
          echo "$DOMINIO_ALUNO" > portal-aluno/CNAME
          cp portal-aluno/index.html portal-aluno/404.html
          touch portal-aluno/.nojekyll
          cd portal-aluno
          git init -q
          git config user.email "deploy@studiopolel.com.br"
          git config user.name "Studio Pole L (deploy)"
          git add -A
          git commit -q -m "Deploy de ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:$TOKEN@github.com/$REPO_ALUNO.git" HEAD:gh-pages
          echo "::notice::Portal do aluno publicado em https://$DOMINIO_ALUNO"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
